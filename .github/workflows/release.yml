name: Release macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release]')
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve version and check release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          npm ci
          python3 -m venv "$RUNNER_TEMP/dmg-venv"
          "$RUNNER_TEMP/dmg-venv/bin/pip" install 'dmgbuild==1.6.7' 'ds_store==1.3.3' 'mac_alias==2.2.3'
      - name: Run frontend tests
        run: npm test
      - name: Build signed application and installer
        env:
          DMGBUILD: ${{ runner.temp }}/dmg-venv/bin/dmgbuild
        run: |
          npm run tauri -- build --bundles app
          npm run build:dmg
      - name: Verify installer and application signature
        run: |
          dmg="src-tauri/target/release/bundle/dmg/DB Studio_${RELEASE_VERSION}_aarch64.dmg"
          mount_point="$RUNNER_TEMP/db-studio-release-check"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount_point/DB Studio.app"
          "$RUNNER_TEMP/dmg-venv/bin/python" scripts/verify-dmg-layout.py "$mount_point"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="src-tauri/target/release/bundle/dmg/DB Studio_${RELEASE_VERSION}_aarch64.dmg"
          gh release create "v$RELEASE_VERSION" "$dmg" \
            --target "$GITHUB_SHA" \
            --title "DB Studio v${RELEASE_VERSION}（未公证）" \
            --notes '优化 PostgreSQL 和 MySQL 的 DDL 查看与复制、SQL 高亮及自动换行；单击表后自动加载数据与结构，并统一顶部操作栏。此版本使用临时签名，尚未通过 Apple 公证；首次打开时 macOS 可能要求在隐私与安全性中确认。仅支持 Apple Silicon。'
      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" --jq '[.assets[] | select(.state == "uploaded" and (.name | endswith(".dmg")))] | length')
          if [ "$asset" != "1" ]; then
            echo "New DMG was not found." >&2
            exit 1
          fi
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" --jq '.assets[] | select(.state == "uploaded" and (.name | endswith(".dmg"))) | .digest')
          dmg="src-tauri/target/release/bundle/dmg/DB Studio_${RELEASE_VERSION}_aarch64.dmg"
          expected="sha256:$(shasum -a 256 "$dmg" | cut -d ' ' -f 1)"
          if [ "$digest" != "$expected" ]; then
            echo "Uploaded DMG checksum could not be verified." >&2
            exit 1
          fi
