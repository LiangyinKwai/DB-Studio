name: Release macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build release DMG
        run: npm run tauri -- build --no-sign --bundles dmg
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'Release v0.1.0 already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create v0.1.0 \
            'src-tauri/target/release/bundle/dmg/DB Studio_0.1.0_aarch64.dmg' \
            --target "$GITHUB_SHA" \
            --title 'DB Studio v0.1.0' \
            --notes 'macOS Apple Silicon release build. This DMG is unsigned and not notarized.'
